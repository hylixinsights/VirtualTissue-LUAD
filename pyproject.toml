[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luad-virtual-tissue"
version = "0.2.1"
description = "An auditable Xenium-initialized LUAD atlas and autonomous individual-cell simulation"
requires-python = ">=3.12"
dependencies = ["h5py>=3.12,<4", "numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.14,<2", "shapely>=2.1,<3", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
